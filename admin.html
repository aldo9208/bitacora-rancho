      h("button", {onClick:()=>setVista("contabilizar"),style:vistaBtn(vista==="contabilizar")}, "📝 Compras"),
      h("button", {onClick:()=>setVista("pagar"),style:vistaBtn(vista==="pagar")}, "💵 Pagos"),
      h("button", {onClick:()=>setVista("aplicar"),style:vistaBtn(vista==="aplicar")}, "🌿 Aplicaciones")
    ),
    vista==="aplicar" && h("div", null,
      h("div", {style:{fontSize:12,color:"#8aa870",background:"rgba(120,180,60,0.08)",border:"1px solid rgba(120,180,60,0.2)",borderRadius:10,padding:"10px 12px",marginBottom:16}},
        "Cada pase de aplicación genera su póliza Dr: Gasto del producto CON centro de costos del rancho / Cr Almacén. Así el costo cae en el rancho donde se aplicó."),
      pasesAp.loading && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30}}, "Cargando…"),
      !pasesAp.loading && pases.length===0 && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30,fontStyle:"italic"}}, "No hay aplicaciones pendientes de contabilizar 🎉"),
      !pasesAp.loading && pases.map((p,pi) => h("div", {key:p.id_actividad||pi,style:C.card},
        h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8,marginBottom:10}},
          h("div", {style:{flex:1,minWidth:0}},
            h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1}}, fmtFecha(p.fecha)),
            h("div", {style:{fontSize:15,fontWeight:700,color:"#c8e898"}}, p.rancho||"—"),
            h("span", {style:{display:"inline-block",marginTop:4,fontSize:11,fontWeight:700,padding:"2px 9px",borderRadius:6,background:p.cc?"rgba(120,180,60,0.2)":"rgba(220,90,70,0.2)",color:p.cc?"#b8e870":"#e89080"}}, p.cc?("Centro de costo "+p.cc):"⚠️ Sin centro de costo")
          ),
          h("div", {style:{textAlign:"right"}},
            h("div", {style:{fontSize:16,fontWeight:800,color:"#e8a030"}}, fmtMXN(p.total)),
            h("div", {style:{fontSize:11,color:"#6a9050"}}, p.lineas.length + (p.lineas.length===1?" producto":" productos"))
          )
        ),
        h("div", {style:{fontSize:12,color:"#9ab880",marginBottom:10,lineHeight:1.5}},
          p.lineas.map((l,li) => l.nombre + " · " + fmtMXN(l.costo) + (l.tipo==="fertilizante"?" (fert)":" (agro)")).join("  ·  ")
        ),
        h("button", {onClick:()=>contabilizarPase(p),disabled:busy===p.id_actividad,style:{...C.bigBtn,padding:"10px 18px",fontSize:14,opacity:busy===p.id_actividad?0.6:1}}, busy===p.id_actividad?"Generando…":"🌿 Generar póliza de aplicación")
      ))
    ),
    vista==="pagar" && h("div", null,
      h("div", {style:{fontSize:12,color:"#8aa870",background:"rgba(80,140,200,0.08)",border:"1px solid rgba(80,140,200,0.2)",borderRadius:10,padding:"10px 12px",marginBottom:16}},
        "Registra el pago de cada factura ya contabilizada: genera la póliza de Egresos (pago a banco) y, si era PPD, reclasifica el IVA a acreditable."),
      porPagar.loading && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30}}, "Cargando…"),
      !porPagar.loading && facturasPagar.length===0 && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30,fontStyle:"italic"}}, "No hay facturas pendientes de pago 🎉"),
      !porPagar.loading && facturasPagar.map((f,fi) => h("div", {key:f.uuid||fi,style:C.card},
        h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8,marginBottom:10}},
          h("div", {style:{flex:1,minWidth:0}},
            h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1}}, fmtFecha(f.fecha) + " · " + (f.folio||"")),
            h("div", {style:{fontSize:15,fontWeight:700,color:"#c8e898"}}, f.proveedor||"—"),
            h("span", {style:{display:"inline-block",marginTop:4,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:6,background:f.metodo==="PPD"?"rgba(200,160,40,0.2)":"rgba(80,160,80,0.2)",color:f.metodo==="PPD"?"#e8c050":"#90d090"}}, f.metodo)
          ),
          h("div", {style:{textAlign:"right"}},
            h("div", {style:{fontSize:16,fontWeight:800,color:"#e8a030"}}, fmtMXN(f.total))
          )
        ),
        h("button", {onClick:()=>pagar(f),disabled:busy===f.uuid,style:{...C.bigBtn,padding:"10px 18px",fontSize:14,opacity:busy===f.uuid?0.6:1}}, busy===f.uuid?"Registrando…":"💵 Registrar pago")
      ))
    ),
    vista==="contabilizar" && h("div", {style:{fontSize:12,color:"#8aa870",background:"rgba(120,160,80,0.08)",border:"1px solid rgba(120,160,80,0.2)",borderRadius:10,padding:"10px 12px",marginBottom:16}},
      "Genera la póliza Dr de cada factura recibida. El CSV para COI se descarga en ⛽ Combustible → 📄 Pólizas para COI (todas las pólizas del rancho juntas)."),
    vista==="contabilizar" && h("div", {style:{marginBottom:16}},
      h("button", {onClick:abrirXmlMes,style:{padding:"10px 16px",background:"rgba(80,140,200,0.15)",border:"1px solid rgba(80,140,200,0.4)",borderRadius:9,color:"#9cc8f0",fontSize:13,fontWeight:600,cursor:"pointer"}}, "📁 Abrir carpeta de XML del mes (para COI)")
    ),
    vista==="contabilizar" && loading && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30}}, "Cargando…"),
    vista==="contabilizar" && error && h("div", {style:{color:"#e08060",padding:14}}, "Error: " + error),
    vista==="contabilizar" && !loading && facturas.length===0 && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30,fontStyle:"italic"}}, "No hay facturas pendientes de contabilizar 🎉"),
    vista==="contabilizar" && !loading && facturas.map((f,fi) => {
      const e = estado[f.uuid] || {metodo:"PPD",clasif:{}};
      return h("div", {key:f.uuid||fi,style:C.card},
        h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8,marginBottom:10}},
          h("div", {style:{flex:1,minWidth:0}},
            h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1}}, fmtFecha(f.fecha) + " · " + (f.folio||"")),
            h("div", {style:{fontSize:15,fontWeight:700,color:"#c8e898"}}, f.proveedor||"—")
          ),
          h("div", {style:{textAlign:"right"}},
            h("div", {style:{fontSize:16,fontWeight:800,color:"#e8a030"}}, fmtMXN(f.total)),
            f.iva>0 && h("div", {style:{fontSize:11,color:"#c8a030"}}, "IVA " + fmtMXN(f.iva))
          )
        ),
        h("div", {style:{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}},
          h("span", {style:{fontSize:11,color:"#6a9050",letterSpacing:1}}, "MÉTODO DE PAGO"),
          h("button", {onClick:()=>setMetodo(f.uuid,"PPD"),style:tipoBtn(e.metodo!=="PUE")}, "PPD (a crédito)"),
          h("button", {onClick:()=>setMetodo(f.uuid,"PUE"),style:tipoBtn(e.metodo==="PUE")}, "PUE (de contado)")
        ),
        f.lineas.map((l,li) => h("div", {key:li,style:{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",padding:"8px 0",borderTop:"1px solid rgba(255,255,255,0.06)"}},
          h("div", {style:{flex:1,minWidth:150}},
            h("div", {style:{fontSize:13,fontWeight:600,color:"#c8e898"}}, l.nombre||"—"),
            h("div", {style:{fontSize:11,color:"#8aa870"}}, "Base " + fmtMXN(l.base) + (l.iva>0?" · IVA " + fmtMXN(l.iva):" · exento"))
          ),
          h("div", {style:{display:"flex",gap:6}},
            h("button", {onClick:()=>setTipo(f.uuid,l.id_producto,"agroquimico"),style:tipoBtn((e.clasif[l.id_producto]||l.sugerido)==="agroquimico")}, "Agroquímico"),
            h("button", {onClick:()=>setTipo(f.uuid,l.id_producto,"fertilizante"),style:tipoBtn((e.clasif[l.id_producto]||l.sugerido)==="fertilizante")}, "Fertilizante")
          )
        )),
        h("div", {style:{marginTop:12}},
          h("button", {onClick:()=>generar(f),disabled:busy===f.uuid,style:{...C.bigBtn,padding:"10px 18px",fontSize:14,opacity:busy===f.uuid?0.6:1}}, busy===f.uuid?"Generando…":"💼 Generar póliza")
        )
      );
    })
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App,null));
</script>
</body>
</html>
