<script>
const {useState,useEffect,createElement:h} = React;
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbyDQAEPlf-By1gL1RhKQkDb5YAeEypB8vMaXupMl2qx2dtQFsG4n9kHrFSWiMCpQw_b/exec";
const PASSWORD = "rancho2026";

const fmtMXN = n => "$" + Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:2});
const fmtNum = n => Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:2});
function load(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch{ return def; }}
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
function fmtFecha(v){if(!v)return "—";try{const d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getFullYear();}catch{return String(v);}}

const C = {
  hdr:{background:"linear-gradient(135deg,#1a3a0e,#142e0a)",padding:"16px 22px",borderBottom:"1px solid rgba(120,200,60,0.18)"},
  inp:{width:"100%",background:"rgba(255,255,255,0.07)",border:"1px solid rgba(140,200,80,0.22)",borderRadius:10,color:"#e8f8d0",padding:"12px 13px",fontSize:15,outline:"none",boxSizing:"border-box"},
  bigBtn:{width:"100%",background:"linear-gradient(135deg,#2a6a14,#1e5010)",border:"none",borderRadius:12,color:"#c8f090",padding:"14px",fontSize:16,fontWeight:700,cursor:"pointer"},
  card:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(120,180,60,0.14)",borderRadius:12,padding:"14px 16px",marginBottom:10},
  stat:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"16px",textAlign:"center"},
  tab:active=>({background:active?"rgba(80,160,30,0.28)":"transparent",border:"none",color:active?"#d8f8a0":"#7a9a68",padding:"12px 18px",fontSize:14,fontWeight:active?700:400,cursor:"pointer",borderBottom:`3px solid ${active?"#70c040":"transparent"}`}),
  chip:active=>({background:active?"rgba(80,160,30,0.28)":"rgba(255,255,255,0.05)",border:`1px solid ${active?"#70c040":"rgba(255,255,255,0.1)"}`,color:active?"#d8f8a0":"#7a9a68",padding:"6px 12px",fontSize:12,fontWeight:active?700:400,cursor:"pointer",borderRadius:18}),
};
const lbl = {fontSize:10,color:"#6a9050",letterSpacing:1.8,textTransform:"uppercase",display:"block",marginBottom:5};

function useFetch(url, deps=[]) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  useEffect(() => {
    setLoading(true); setError(null);
    fetch(url).then(r=>r.json()).then(d=>{setData(d);setLoading(false);}).catch(e=>{setError(e.toString());setLoading(false);});
  }, deps);
  return {data, loading, error};
}

function Login({onOk}) {
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState(false);
  const intentar = () => { if (pwd === PASSWORD) { save("admin_ok", true); onOk(); } else { setErr(true); setTimeout(() => setErr(false), 2000); } };
  return h("div", {style:{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20}},
    h("div", {style:{maxWidth:380,width:"100%"}},
      h("div", {style:{textAlign:"center",marginBottom:24}},
        h("div", {style:{fontSize:48,marginBottom:8}}, "🌱"),
        h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:2.5}}, "ADMINISTRACIÓN"),
        h("div", {style:{fontSize:24,fontWeight:700,color:"#b8e870",marginTop:4}}, "Bitácora del Rancho")
      ),
      h("div", {style:{...C.card,padding:"22px"}},
        h("label", {style:lbl}, "Contraseña"),
        h("input", {type:"password",value:pwd,onChange:e=>setPwd(e.target.value),onKeyDown:e=>e.key==="Enter"&&intentar(),placeholder:"••••••••",autoFocus:true,style:{...C.inp,marginBottom:14,borderColor:err?"rgba(200,80,80,0.5)":undefined}}),
        err && h("div", {style:{color:"#e08080",fontSize:13,marginBottom:10}}, "Contraseña incorrecta"),
        h("button", {onClick:intentar,style:C.bigBtn}, "Entrar →")
      )
    )
  );
}

function FormAgregarManual({ onSaved }) {
  const [open, setOpen] = useState(false);
  const [cat, setCat] = useState([]);
  const [modo, setModo] = useState("__NUEVO__");
  const [nombre, setNombre] = useState("");
  const [tipo, setTipo] = useState("");
  const [unidadBase, setUnidadBase] = useState("L");
  const [cantidad, setCantidad] = useState("");
  const [factor, setFactor] = useState("1");
  const [precio, setPrecio] = useState("");
  const [proveedor, setProveedor] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [msg, setMsg] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    fetch(SHEETS_URL + "?accion=obtener_catalogo").then(r=>r.json()).then(d=>{ if(d.ok) setCat(d.productos||[]); }).catch(()=>{});
  }, [open]);

  const esNuevo = modo === "__NUEVO__";
  const totalBase = Math.round((parseFloat(cantidad)||0) * (parseFloat(factor)||1) * 100) / 100;

  const onModo = (val) => {
    setModo(val);
    const p = cat.find(x => x.id === val);
    if (p) {
      setNombre(p.nombre_comercial || "");
      setUnidadBase(p.unidad_aplicacion || p.unidad_compra || "L");
      if (Number(p.factor_conversion) > 0) setFactor(String(p.factor_conversion));
    }
  };

  const guardar = async () => {
    setErr(null); setMsg(null);
    if (esNuevo && !nombre.trim()) { setErr("Escribe el nombre del producto"); return; }
    if (!(parseFloat(cantidad) > 0)) { setErr("La cantidad debe ser mayor a 0"); return; }
    setGuardando(true);
    try {
      const importe = Math.round((parseFloat(cantidad)||0) * (parseFloat(precio)||0) * 100) / 100;
      const linea = {
        nuevo: esNuevo,
        id_producto: esNuevo ? "" : modo,
        nombre_producto: nombre,
        tipo: tipo,
        unidad_compra: unidadBase,
        unidad_aplicacion: unidadBase,
        factor_conversion: parseFloat(factor) || 1,
        cantidad_compra: parseFloat(cantidad) || 0,
        cantidad_total_unidad_base: totalBase,
        precio_unitario: parseFloat(precio) || 0,
        importe: importe, iva: 0, total: importe
      };
      const payload = {
        accion: "confirmar_entradas_agro",
        proveedor: proveedor || "Entrada manual",
        folio_factura: "", folio_fiscal: "",
        fecha: new Date().toISOString().slice(0,10),
        capturado_por: "Admin",
        notas: "Entrada manual",
        estado_default: "pendiente",
        lineas: [linea]
      };
      const res = await fetch(SHEETS_URL, { method:"POST", body: JSON.stringify(payload) });
      const d = await res.json();
      if (d.ok) {
        setMsg((esNuevo ? "Producto creado · " : "") + "Entrada agregada: " + totalBase + " " + unidadBase);
        setNombre(""); setTipo(""); setCantidad(""); setFactor("1"); setPrecio(""); setProveedor(""); setModo("__NUEVO__");
        fetch(SHEETS_URL + "?accion=obtener_catalogo").then(r=>r.json()).then(dd=>{ if(dd.ok) setCat(dd.productos||[]); }).catch(()=>{});
        if (onSaved) onSaved();
      } else { setErr(d.error || "No se pudo guardar"); }
    } catch (e) { setErr(e.toString()); }
    finally { setGuardando(false); }
  };

  return h("div", {style:{...C.card, marginBottom:16, border:"1px solid rgba(120,200,80,0.3)"}},
    h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"},onClick:()=>setOpen(o=>!o)},
      h("div", {style:{fontSize:13,fontWeight:700,color:"#b8e870"}}, "➕ Agregar producto / entrada manual"),
      h("div", {style:{fontSize:20,color:"#90c848"}}, open ? "−" : "+")
    ),
    open && h("div", {style:{marginTop:14}},
      msg && h("div", {style:{padding:10,background:"rgba(80,160,30,0.15)",border:"1px solid rgba(120,200,80,0.3)",borderRadius:9,marginBottom:12,color:"#b8e870",fontSize:13}}, "✅ " + msg),
      err && h("div", {style:{padding:10,background:"rgba(200,80,60,0.1)",border:"1px solid rgba(200,80,60,0.3)",borderRadius:9,marginBottom:12,color:"#e08060",fontSize:13}}, "⚠️ " + err),
      h("label", {style:lbl}, "Producto"),
      h("select", {value:modo,onChange:e=>onModo(e.target.value),style:{...C.inp,marginBottom:12}},
        h("option", {value:"__NUEVO__"}, "➕ Producto nuevo"),
        cat.map(p => h("option", {key:p.id,value:p.id}, p.nombre_comercial))
      ),
      esNuevo && h("div", {style:{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10,marginBottom:12}},
        h("div", null, h("label", {style:lbl}, "Nombre"), h("input", {value:nombre,onChange:e=>setNombre(e.target.value),placeholder:"Ej: Sivanto Prime",style:C.inp})),
        h("div", null, h("label", {style:lbl}, "Tipo (opcional)"), h("input", {value:tipo,onChange:e=>setTipo(e.target.value),placeholder:"Insecticida…",style:C.inp}))
      ),
      h("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1.2fr",gap:10,marginBottom:12}},
        h("div", null, h("label", {style:lbl}, "Cantidad"), h("input", {type:"number",step:"0.01",value:cantidad,onChange:e=>setCantidad(e.target.value),style:C.inp})),
        h("div", null, h("label", {style:lbl}, "Unidad base"), h("select", {value:unidadBase,onChange:e=>setUnidadBase(e.target.value),style:C.inp}, ["L","kg","mL","g","PZA"].map(u=>h("option",{key:u,value:u},u)))),
        h("div", null, h("label", {style:lbl}, "× Contenido"), h("input", {type:"number",step:"0.01",value:factor,onChange:e=>setFactor(e.target.value),style:C.inp})),
        h("div", null, h("label", {style:lbl}, "= Total " + unidadBase), h("div", {style:{...C.inp,background:"rgba(80,160,30,0.1)",color:"#90c848",fontWeight:700,display:"flex",alignItems:"center"}}, totalBase + " " + unidadBase))
      ),
      h("div", {style:{display:"grid",gridTemplateColumns:"1fr 2fr",gap:10,marginBottom:12}},
        h("div", null, h("label", {style:lbl}, "Precio unitario (opc.)"), h("input", {type:"number",step:"0.01",value:precio,onChange:e=>setPrecio(e.target.value),placeholder:"$",style:C.inp})),
        h("div", null, h("label", {style:lbl}, "Proveedor / nota (opc.)"), h("input", {value:proveedor,onChange:e=>setProveedor(e.target.value),placeholder:"Ej: ajuste de inventario",style:C.inp}))
      ),
      h("button", {onClick:guardar,disabled:guardando,style:{...C.bigBtn,opacity:guardando?0.6:1,cursor:guardando?"wait":"pointer"}}, guardando ? "⏳ Guardando…" : "💾 Agregar a inventario")
    )
  );
}

function TabDashboard() {
  const [refresh, setRefresh] = useState(0);
  const {data, loading, error} = useFetch(SHEETS_URL + "?accion=obtener_inventario", [refresh]);
  const inventario = (data && data.inventario) || [];
  const totalValor = inventario.reduce((s,p)=>s+Number(p.valor_inventario||0),0);
  const negativos = inventario.filter(p => Number(p.stock_actual||0) < 0).length;
  return h("div", null,
    h("div", {style:{marginBottom:18}},
      h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:2,marginBottom:4}}, "INVENTARIO"),
      h("div", {style:{fontSize:22,fontWeight:700,color:"#b8e870"}}, "Agroquímicos")
    ),
    h(FormAgregarManual, { onSaved: () => setRefresh(r => r + 1) }),
    h("div", {className:"grid3",style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:18}},
      h("div", {style:C.stat}, h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "PRODUCTOS"), h("div", {style:{fontSize:28,fontWeight:800,color:"#b8e870"}}, inventario.length)),
      h("div", {style:C.stat}, h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "VALOR INVENTARIO"), h("div", {style:{fontSize:22,fontWeight:800,color:"#e8a030"}}, fmtMXN(totalValor))),
      h("div", {style:C.stat}, h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "STOCK NEGATIVO"), h("div", {style:{fontSize:28,fontWeight:800,color:negativos>0?"#e08060":"#90c848"}}, negativos))
    ),
    loading && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30}}, "Cargando…"),
    error && h("div", {style:{color:"#e08060",padding:14,background:"rgba(200,80,60,0.1)",borderRadius:10}}, "Error: " + error),
    !loading && inventario.length === 0 && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30,fontStyle:"italic"}}, "Sin productos registrados"),
    !loading && inventario.map((p,i) => h("div", {key:i,style:C.card},
      h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}},
        h("div", null, h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.2}}, p.id_producto), h("div", {style:{fontSize:15,fontWeight:700,color:"#c8e898"}}, p.nombre_producto)),
        Number(p.stock_actual||0) < 0 && h("div", {style:{fontSize:11,color:"#e08060",background:"rgba(200,80,60,0.15)",padding:"3px 9px",borderRadius:10,fontWeight:700}}, "⚠️ NEGATIVO")
      ),
      h("div", {className:"grid4",style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginTop:8}},
        h("div", null, h("div", {style:{fontSize:10,color:"#5a7a40",letterSpacing:1}}, "ENTRADAS"), h("div", {style:{fontSize:14,color:"#90c848"}}, fmtNum(p.entradas_total) + " " + (p.unidad_base||""))),
        h("div", null, h("div", {style:{fontSize:10,color:"#5a7a40",letterSpacing:1}}, "APLICADO"), h("div", {style:{fontSize:14,color:"#c8a030"}}, fmtNum(p.aplicaciones_total) + " " + (p.unidad_base||""))),
        h("div", null, h("div", {style:{fontSize:10,color:"#5a7a40",letterSpacing:1}}, "STOCK"), h("div", {style:{fontSize:14,fontWeight:700,color:Number(p.stock_actual)<0?"#e08060":"#b8e870"}}, fmtNum(p.stock_actual) + " " + (p.unidad_base||""))),
        h("div", null, h("div", {style:{fontSize:10,color:"#5a7a40",letterSpacing:1}}, "VALOR"), h("div", {style:{fontSize:14,color:"#e8a030"}}, fmtMXN(p.valor_inventario)))
      )
    ))
  );
}

function TabActividades() {
  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const ahora = new Date();
  const [mes, setMes] = useState(MESES[ahora.getMonth()] + " " + ahora.getFullYear());
  const [filtroRancho, setFiltroRancho] = useState("");
  const [filtroDia, setFiltroDia] = useState("");
  const [reload, setReload] = useState(0);
  const [editId, setEditId] = useState(null);
  const [editSemana, setEditSemana] = useState("");
  const [editJorn, setEditJorn] = useState([]);
  const [editDestajo, setEditDestajo] = useState(false);
  const [editPrecio, setEditPrecio] = useState("");
  const [busy, setBusy] = useState(false);
  const {data, loading, error} = useFetch(SHEETS_URL + "?accion=obtener_actividades&mes=" + encodeURIComponent(mes), [mes, reload]);
  const actividades = (data && data.actividades) || [];
  function parseJorn(str){
    return String(str||"").split(",").map(function(p){
      var m = p.trim().match(/^(.+?)\s*\$([\d,]+)$/);
      if(m) return {nombre:m[1].trim(), pago:Number(m[2].replace(/,/g,""))||0};
      var t = p.trim(); return t ? {nombre:t, pago:0} : null;
    }).filter(Boolean);
  }
  function abrirEdit(a){
    setEditId(a.ID);
    const sm = String(a.Semana||"").match(/\d+/);
    setEditSemana(sm ? sm[0] : "");
    setEditJorn(parseJorn(a.Jornaleros).map(j=>({...j, rejas:""})));
    setEditDestajo(/cosech/i.test(String(a.Actividad||"")));
    setEditPrecio("");
  }
  const precioNum = () => Number(String(editPrecio).replace(/[^0-9.]/g,""))||0;
  const rejasNum = (r) => Number(String(r).replace(/[^0-9.]/g,""))||0;
  async function guardarEdit(a){
    if(busy) return;
    setBusy(true);
    try{
      const precio = precioNum();
      const jorn = editJorn.map(j => {
        const rejas = rejasNum(j.rejas);
        const pago = editDestajo ? Math.round(rejas*precio*100)/100 : (Number(String(j.pago).replace(/[^0-9.]/g,""))||0);
        return {nombre:j.nombre, pago:pago, rejas:rejas};
      });
      const url = SHEETS_URL + "?accion=editar_actividad&mes=" + encodeURIComponent(mes) + "&id=" + encodeURIComponent(a.ID) + "&semana=" + encodeURIComponent(editSemana) + "&jornaleros=" + encodeURIComponent(JSON.stringify(jorn.map(j=>({nombre:j.nombre,pago:j.pago}))));
      const d = await (await fetch(url)).json();
      if(!d.ok){ alert("No se pudo: " + (d.error||"error")); setBusy(false); return; }
      if(editDestajo){
        await fetch(SHEETS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ accion:"guardar_cosecha_destajo", id_actividad:a.ID, fecha:a["Fecha registro"], rancho:a.Lugar, precio_reja:precio, jornaleros:jorn })});
      }
      setEditId(null); setReload(x=>x+1);
    }catch(e){ alert("Error: " + e); }
    setBusy(false);
  }
  const miniToggle = (activo) => ({flex:1,padding:"7px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",border:"1px solid " + (activo?"rgba(120,180,60,0.6)":"rgba(255,255,255,0.12)"),background:activo?"rgba(120,180,60,0.18)":"rgba(255,255,255,0.03)",color:activo?"#c8f090":"#7a9058"});
  const mesesOpciones = [];
  for (let i = 0; i < 6; i++) { const d = new Date(ahora.getFullYear(), ahora.getMonth() - i, 1); mesesOpciones.push(MESES[d.getMonth()] + " " + d.getFullYear()); }
  const ranchos = [...new Set(actividades.map(a => a.Lugar).filter(Boolean))];
  const dias = [...new Set(actividades.map(a => a.Dia).filter(Boolean))];
  const filtradas = actividades.filter(a => {
    if (filtroRancho && a.Lugar !== filtroRancho) return false;
    if (filtroDia && a.Dia !== filtroDia) return false;
    return true;
  });
  const totalRaya = filtradas.reduce((s,a) => s + Number(a["Raya total"]||0), 0);

  return h("div", null,
    h("div", {style:{marginBottom:18}},
      h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:2,marginBottom:4}}, "DEL MES"),
      h("div", {style:{fontSize:22,fontWeight:700,color:"#b8e870"}}, "Actividades")
    ),
    h("div", {style:{marginBottom:14}},
      h("label", {style:lbl}, "Mes"),
      h("select", {value:mes,onChange:e=>setMes(e.target.value),style:{...C.inp,maxWidth:280}},
        mesesOpciones.map(m => h("option", {key:m,value:m}, m))
      )
    ),
    h("div", {className:"grid3",style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:14}},
      h("div", {style:C.stat}, h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "ACTIVIDADES"), h("div", {style:{fontSize:28,fontWeight:800,color:"#b8e870"}}, filtradas.length)),
      h("div", {style:C.stat}, h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "RAYA TOTAL"), h("div", {style:{fontSize:22,fontWeight:800,color:"#e8a030"}}, fmtMXN(totalRaya))),
      h("div", {style:C.stat}, h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "RANCHOS"), h("div", {style:{fontSize:28,fontWeight:800,color:"#90c848"}}, ranchos.length))

function TabAplicaciones() {
  const [reload, setReload] = useState(0);
  const [busy, setBusy] = useState("");
  const {data, loading, error} = useFetch(SHEETS_URL + "?accion=obtener_aplicaciones", [reload]);
  const aplicaciones = (data && data.aplicaciones) || [];
  const [filtroProducto, setFiltroProducto] = useState("");
  const [filtroRancho, setFiltroRancho] = useState("");
  const [editId, setEditId] = useState(null);
  const [editVal, setEditVal] = useState("");
  const [confAnular, setConfAnular] = useState(null);
  const [errMsg, setErrMsg] = useState("");
  const productos = [...new Set(aplicaciones.map(a => a.nombre_producto).filter(Boolean))];
  const ranchos = [...new Set(aplicaciones.map(a => a.rancho).filter(Boolean))];
  const filtradas = aplicaciones.filter(a => {
    if (filtroProducto && a.nombre_producto !== filtroProducto) return false;
    if (filtroRancho && a.rancho !== filtroRancho) return false;
    return true;
  });
  const totalCosto = filtradas.reduce((s,a) => s + Number(a.costo_total||0), 0);

  async function accionAplic(id, accion, extra) {
    if (busy) return;
    setBusy(id); setErrMsg("");
    try {
      const url = SHEETS_URL + "?accion=" + accion + "&id=" + encodeURIComponent(id) + (extra||"");
      const res = await fetch(url);
      const d = await res.json();
      if (d.ok) setReload(x=>x+1);
      else setErrMsg("No se pudo: " + (d.error||"error"));
    } catch(e) { setErrMsg("Error: " + e); }
    setBusy("");
  }
  function anular(a) { setEditId(null); setErrMsg(""); setConfAnular(a.id_aplicacion); }
  function confirmarAnular(a) {
    setConfAnular(null);
    accionAplic(a.id_aplicacion, "anular_aplicacion", "&motivo=" + encodeURIComponent("anulada desde admin"));
  }
  function corregir(a) { setConfAnular(null); setErrMsg(""); setEditId(a.id_aplicacion); setEditVal(String(a.cantidad_aplicada)); }
  function guardarCorr(a) {
    const n = parseFloat(String(editVal).replace(",","."));

    setEditId(null);

  const grupos = [];

      };
      if (pdfFile) { payload.pdf_base64 = await fileToBase64(pdfFile); payload.pdf_filename = pdfFile.name; }

      if (data.ok) {
        setResultado(data);
        setForm({

          fecha: form.fecha, id_producto:"", nombre_producto:"", unidad_compra:"",

          precio_unitario:"", importe:"", iva:"", total:"", notas:"",

      } else { setError(data.error || "Error al guardar"); }
    } catch (e) { setError(e.toString()); }
    finally { setEnviando(false); setTimeout(() => setResultado(null), 5000); }
  };

  const guessUnidad = (desc, parsed) => {
    const d = String(desc||"").toUpperCase();
    if (d.indexOf("KG")>=0) return "kg";
    if (d.indexOf("ML")>=0) return "mL";
    if (d.indexOf(" LT")>=0 || d.indexOf("LITRO")>=0 || /\bL\b/.test(d)) return "L";
    const p = String(parsed||"").toLowerCase();
    if (p.indexOf("kg")>=0) return "kg";
    if (p.indexOf("ml")>=0) return "mL";
    if (p.indexOf("l")>=0) return "L";
    return "L";
  };

  const leerFactura = async () => {
    if (!facturaFile) { setErrAuto("Selecciona el XML o PDF de la factura"); return; }
    setErrAuto(null); setResAuto(null); setParseando(true);
    try {
      const esXml = /\.xml$/i.test(facturaFile.name);
      const b64 = await fileToBase64(facturaFile);
      setXmlB64(esXml ? b64 : null);
      const payload = esXml

      const d = await res.json();
      if (!d.ok) { setErrAuto(d.error || "No se pudo leer la factura"); setParseando(false); return; }
      setHeaderRev(d.header || {});

      setLineasRev((d.lineas || []).map(l => {

        const fac = cat && Number(cat.factor_conversion) > 0 ? Number(cat.factor_conversion) : 1;
        const cant = Number(l.cantidad) || 0;
        return {
          descripcion: l.descripcion,
          match_id: l.match_id, match_nombre: l.match_nombre, match_score: l.match_score,
          modo: l.match_id ? l.match_id : "__NUEVO__",

  const setLineaRev = (i, patch) => setLineasRev(prev => prev.map((l,idx) => idx===i ? {...l, ...patch} : l));

  const cambiarModo = (i, val) => {
    const cat = catalogo.find(x => x.id === val);

    setLineasRev(prev => prev.map((l,idx) => {

      return next;
    }));
  };

            h("span", {style:{fontSize:11,color:"#6ab0e0",whiteSpace:"nowrap"}}, "🔗 Conciliar:"),

              h("option", {value:""}, "No — crear entrada nueva"),

          h("div", null,

              h("span", {style:{fontSize:11,color:l.modo==="__NUEVO__"?"#e8a030":"#90c848",whiteSpace:"nowrap"}}, l.modo==="__NUEVO__" ? "➕ Nuevo:" : "✓ Catálogo:"),
              h("select", {value:l.modo,onChange:e=>cambiarModo(i,e.target.value),style:{...C.inp,flex:1,padding:"6px 10px",fontSize:13,border:l.modo==="__NUEVO__"?"1px solid rgba(240,180,80,0.5)":"1px solid rgba(120,200,80,0.4)"}},
                h("option", {value:"__NUEVO__"}, "➕ Crear producto nuevo"),
                catalogo.map(p => h("option", {key:p.id,value:p.id}, p.nombre_comercial))
              )

            h("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1.2fr",gap:8}},

        )
      )

      "⚠️ " + error
    ),

      h("div", {className:"grid2",style:{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10,marginBottom:10}},
        h("div", null, h("label", {style:lbl}, "Proveedor"), h("input", {value:form.proveedor,onChange:e=>setForm(f=>({...f,proveedor:e.target.value})),placeholder:"Ej: SERVICIO AGROTECNICO",style:C.inp})),

// ── Sub: Pendientes de contabilizar ──────────────────────────────────────────
function SubCombustiblePendientes() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [selected, setSelected] = useState(null);  // carga individual seleccionada
  const [modoFactura, setModoFactura] = useState(null);  // {datos, sugeridas} si subió XML/PDF
  const [refresh, setRefresh] = useState(0);
  const [procesando, setProcesando] = useState(false);

  useEffect(() => {
    setLoading(true); setError("");
    fetch(SHEETS_URL + "?accion=obtener_cargas_pendientes")
      .then(r => r.json())
      .then(d => { setData(d); setLoading(false); })
      .catch(e => { setError(e.toString()); setLoading(false); });
  }, [refresh]);

  // Procesar factura subida (XML o PDF) — pasa a modo consolidación
  const procesarFactura = async (file) => {
    if (!file) return;
    setError(""); setProcesando(true);
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const isXML = file.name.toLowerCase().endsWith(".xml");
      const payload = isXML
        ? { accion: "procesar_xml", xml_base64: base64 }
        : { accion: "procesar_pdf", pdf_base64: base64 };
      const res = await fetch(SHEETS_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if (!data.ok) { setError(data.error || "Error procesando"); setProcesando(false); return; }
      const d = data.datos;
      // Buscar cargas que correspondan a esta factura
      const fechaParam = d.fecha ? d.fecha.substring(0, 10) : "";
      const total = Number(d.total) || 0;
      const busqueda = await fetch(SHEETS_URL + "?accion=buscar_cargas_para_factura&fecha_factura=" + encodeURIComponent(fechaParam) + "&total_factura=" + total).then(r => r.json());
      setModoFactura({ datos: d, busqueda: busqueda, fileName: file.name });
    } catch (e) {
      setError("Error: " + e.toString());
    } finally { setProcesando(false); }
  };

  if (selected) {
    return h(FormContabilizar, {
      carga: selected,
      onCancel: () => setSelected(null),
      onSaved: () => { setSelected(null); setRefresh(r => r+1); }
    });
  }

  if (modoFactura) {
    return h(FormContabilizarConXML, {
      datos: modoFactura.datos,
      busqueda: modoFactura.busqueda,
      fileName: modoFactura.fileName,
      onCancel: () => setModoFactura(null),
      onSaved: () => { setModoFactura(null); setRefresh(r => r+1); }
    });
  }

  const cargas = (data && data.cargas) || [];
  return h("div", null,
    loading && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30}}, "Cargando..."),
    error && h("div", {style:{color:"#e08060",padding:14,background:"rgba(200,80,60,0.1)",borderRadius:10,marginBottom:14}}, "Error: " + error),
    // Botón grande para subir factura XML/PDF y consolidar
    !loading && cargas.length > 0 && h("div", {style:{padding:14,marginBottom:14,background:"rgba(80,140,200,0.08)",border:"1px dashed rgba(120,180,240,0.35)",borderRadius:10}},
      h("div", {style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
        h("div", {style:{flex:1,minWidth:200}},
          h("div", {style:{fontSize:13,color:"#a0c8f0",fontWeight:700,marginBottom:2}}, "📄 Tienes una factura que agrupa varias cargas?"),
          h("div", {style:{fontSize:11,color:"#7a98c0"}}, "Sube el XML del CFDI o el PDF. El sistema buscará y agrupará las cargas pendientes automáticamente.")
        ),
        h("label", {style:{background:"linear-gradient(135deg,#3a5ea8,#2a4080)",border:"none",borderRadius:9,
                            color:"#d8e8ff",padding:"10px 18px",fontSize:13,fontWeight:700,
                            cursor:procesando?"not-allowed":"pointer",opacity:procesando?0.6:1}},
          procesando ? "⏳ Procesando..." : "📎 Subir factura (XML/PDF)",
          h("input", {type:"file",accept:".xml,.pdf,application/xml,text/xml,application/pdf",
                     style:{display:"none"},disabled:procesando,
                     onChange:e => { if (e.target.files[0]) procesarFactura(e.target.files[0]); }})
        )
      )
    ),
    !loading && cargas.length === 0 && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30,fontStyle:"italic"}},
      "🎉 No hay cargas pendientes. ¡Todo contabilizado!"),
    !loading && cargas.length > 0 && h("div", {style:{fontSize:11,color:"#5a7a40",letterSpacing:1.5,marginBottom:10}},
      cargas.length + " CARGA" + (cargas.length>1?"S":"") + " PENDIENTE" + (cargas.length>1?"S":"") + " · O CONTABILIZA UNA A UNA"),
    !loading && cargas.map((c,i) => h("div", {key:i,style:C.card},
      h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8,flexWrap:"wrap",gap:8}},
        h("div", {style:{flex:1,minWidth:200}},
          h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.2,marginBottom:2}},
            fmtFecha(c.fecha) + " · " + c.id),
          h("div", {style:{fontSize:15,fontWeight:700,color:"#c8e898"}}, c.tipo),
          h("div", {style:{fontSize:13,color:"#a0c870",marginTop:2}}, c.lugar || "—"),
          c.notas && h("div", {style:{fontSize:11,color:"#7a9058",marginTop:2,fontStyle:"italic"}}, c.notas)
        ),
        h("div", {style:{textAlign:"right"}},
          h("div", {style:{fontSize:14,fontWeight:700,color:"#90c848"}}, fmtNum(c.litros) + " L"),
          h("div", {style:{fontSize:15,fontWeight:700,color:"#e8a030"}}, fmtMXN(c.total)),
          h("div", {style:{fontSize:11,color:"#7a9058"}}, fmtMXN(c.precio_L) + "/L")
        )
      ),
      h("div", {style:{display:"flex",gap:8,marginTop:10,paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.05)",flexWrap:"wrap"}},
        c.link_foto_ticket && h("a", {href:c.link_foto_ticket,target:"_blank",
          style:{...C.ghost,padding:"7px 12px",fontSize:12,textDecoration:"none",display:"inline-block"}},
          "📸 Ver ticket"),
        h("button", {onClick:()=>setSelected(c),
          style:{background:"linear-gradient(135deg,#2a6a14,#1e5010)",border:"none",borderRadius:9,
                 color:"#c8f090",padding:"7px 16px",fontSize:13,fontWeight:700,cursor:"pointer"}},
          "💼 Contabilizar")
      )
    ))
  );
}

// ── Form: Contabilizar VARIAS cargas con factura XML/PDF ──────────────────────
function FormContabilizarConXML({datos, busqueda, fileName, onCancel, onSaved}) {
  // Pre-seleccionar las cargas sugeridas
  const sugeridas = (busqueda && busqueda.sugeridas) || [];
  const cargas = (busqueda && busqueda.cargas) || [];
  const [seleccionadas, setSeleccionadas] = useState(new Set(sugeridas));
  const [metodoPago, setMetodoPago] = useState("PPD");
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState("");
  const CENTROS_COSTOS = [
    {c:"2", n:"Rancho La Unión"},
    {c:"3", n:"Rancho El Arenal"},
    {c:"4", n:"Rancho Loma Bonita"},
    {c:"5", n:"Rancho Vista Hermosa"},
    {c:"7", n:"Nissan"},
    {c:"9", n:"Tractor"},
    {c:"10", n:"Desmalezadoras"},
    {c:"1", n:"Moto-Pro"},
    {c:"6", n:"P.Aldo"},
    {c:"8", n:"Bellíssima"}
  ];
  const [ccPorCarga, setCcPorCarga] = useState({});
  const setCC = (id, val) => setCcPorCarga(prev => ({...prev, [id]: val}));
  useEffect(() => {
    const init = {};
    cargas.forEach(c => { if (c.centro_costos) init[c.id] = String(c.centro_costos); });
    if (Object.keys(init).length) setCcPorCarga(prev => ({...init, ...prev}));
  }, []);

  const toggle = (id) => {
    const ns = new Set(seleccionadas);
    if (ns.has(id)) ns.delete(id); else ns.add(id);
    setSeleccionadas(ns);
  };

  const sumaCargasSel = Array.from(seleccionadas).reduce((s, id) => {
    const c = cargas.find(x => x.id === id);
    return s + (c ? Number(c.total)||0 : 0);
  }, 0);

  const totalFactura = Number(datos.total) || 0;
  const cuadra = Math.abs(sumaCargasSel - totalFactura) <= 0.50;

  const enviar = async () => {
    if (seleccionadas.size === 0) { setError("Selecciona al menos una carga"); return; }
    if (!cuadra) { setError("La suma de cargas seleccionadas no cuadra con el total de la factura"); return; }
    const faltanCC = Array.from(seleccionadas).filter(id => !ccPorCarga[id]);
    if (faltanCC.length > 0) { setError("Falta asignar centro de costos a " + faltanCC.length + " carga(s) seleccionada(s)"); return; }
    setEnviando(true); setError("");
    try {
      const payload = {
        accion: "marcar_carga_contabilizada",
        ids: Array.from(seleccionadas),
        proveedor: datos.proveedor || "",
        rfc_emisor: datos.rfc_emisor || "",
        folio_factura: datos.folio_factura || "",
        folio_fiscal: datos.folio_fiscal || "",
        fecha_factura: datos.fecha || new Date().toISOString(),
        subtotal: Number(datos.subtotal) || 0,
        iva: Number(datos.iva) || 0,
        ieps: Number(datos.ieps) || 0,
        total_factura: totalFactura,
        forma_pago: metodoPago === "PUE" ? "03" : "99",
        metodo_pago: metodoPago,
        contabilizado_por: "Adry",
        centros_costos: Array.from(seleccionadas).reduce((acc,id)=>{ acc[id] = ccPorCarga[id] || ""; return acc; }, {})
      };
      const res = await fetch(SHEETS_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.ok) {
        alert("✅ " + data.cargas_contabilizadas + " cargas contabilizadas. Póliza #" + data.numero_poliza);
        onSaved();
      } else {
        setError(data.error || "Error al contabilizar");
      }
    } catch (e) {
      setError("Error: " + e.toString());
    } finally { setEnviando(false); }
  };

  const lbl = {fontSize:10,color:"#7a9050",letterSpacing:1,marginBottom:4,display:"block"};

  return h("div", null,
    h("div", {style:{marginBottom:14,display:"flex",alignItems:"center",gap:10}},
      h("button", {onClick:onCancel,style:C.ghost}, "← Volver"),
      h("div", {style:{fontSize:18,fontWeight:700,color:"#c8e898"}}, "Contabilizar con factura"),
      h("div", {style:{fontSize:11,color:"#7a9058",fontStyle:"italic"}}, fileName)
    ),
    error && h("div", {style:{color:"#e08060",padding:14,background:"rgba(200,80,60,0.1)",borderRadius:10,marginBottom:14}}, "⚠️ " + error),
    // Datos de la factura
    h("div", {style:C.card},
      h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:1.5,marginBottom:10}}, "DATOS DE LA FACTURA"),
      h("div", {style:{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10,marginBottom:10}},
        h("div", null,
          h("label", {style:lbl}, "Proveedor"),
          h("div", {style:{fontSize:14,fontWeight:600,color:"#c8e898"}}, datos.proveedor || "—")
        ),
        h("div", null,
          h("label", {style:lbl}, "RFC"),
          h("div", {style:{fontSize:13,color:"#a0c870",fontFamily:"monospace"}}, datos.rfc_emisor || "—")
        )
      ),
      h("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}},
        h("div", null,
          h("label", {style:lbl}, "Folio"),
          h("div", {style:{fontSize:13,color:"#c8e898"}}, datos.folio_factura || "—")
        ),
        h("div", null,
          h("label", {style:lbl}, "Fecha"),
          h("div", {style:{fontSize:13,color:"#c8e898"}}, datos.fecha ? datos.fecha.substring(0,10) : "—")
        ),
        h("div", null,
          h("label", {style:lbl}, "Método pago"),
          h("select", {value:metodoPago,onChange:e=>setMetodoPago(e.target.value),style:{...C.inp,fontSize:13,padding:"6px 10px"}},
            h("option", {value:"PPD"}, "PPD (a crédito)"),
            h("option", {value:"PUE"}, "PUE (pago inmediato)")
          )
        )
      ),
      datos.folio_fiscal && h("div", {style:{marginBottom:10}},
        h("label", {style:lbl}, "UUID (folio fiscal)"),
        h("div", {style:{fontSize:11,color:"#a0c870",fontFamily:"monospace",wordBreak:"break-all"}}, datos.folio_fiscal)
      ),
      // Aviso si el IEPS fue calculado implícitamente
      datos.ieps_calculado_implicito && h("div", {style:{padding:10,marginBottom:10,background:"rgba(80,140,200,0.1)",border:"1px solid rgba(120,180,240,0.3)",borderRadius:9,fontSize:11,color:"#a0c8f0"}},
        "💡 ", h("strong", null, "IEPS calculado automáticamente"), " — el XML no lo trajo desglosado.",
        h("br"),
        "Subtotal XML original: ", h("strong", null, fmtMXN(Number(datos.subtotal_xml)||0)),
        " · Base gravable real (IVA÷0.16): ", h("strong", null, fmtMXN(Number(datos.subtotal)||0)),
        " · IEPS = $", h("strong", null, fmtMXN(Number(datos.ieps)||0))
      ),
      // Desglose monetario
      h("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,padding:12,background:"rgba(50,80,30,0.2)",borderRadius:9}},
        h("div", null,
          h("div", {style:{fontSize:10,color:"#7a9050",letterSpacing:1,marginBottom:2}}, "Subtotal gravable"),
          h("div", {style:{fontSize:14,fontWeight:600,color:"#c8e898"}}, fmtMXN(Number(datos.subtotal)||0))
        ),
        h("div", null,
          h("div", {style:{fontSize:10,color:"#7a9050",letterSpacing:1,marginBottom:2}}, "IEPS" + (datos.ieps_calculado_implicito ? " 🧮" : "")),
          h("div", {style:{fontSize:14,fontWeight:600,color:datos.ieps_calculado_implicito?"#8ab0e0":"#c8e898"}}, fmtMXN(Number(datos.ieps)||0))
        ),
        h("div", null,
          h("div", {style:{fontSize:10,color:"#7a9050",letterSpacing:1,marginBottom:2}}, "IVA"),
          h("div", {style:{fontSize:14,fontWeight:600,color:"#c8e898"}}, fmtMXN(Number(datos.iva)||0))
        ),
        h("div", null,
          h("div", {style:{fontSize:10,color:"#e8a030",letterSpacing:1,marginBottom:2}}, "TOTAL"),
          h("div", {style:{fontSize:15,fontWeight:700,color:"#e8a030"}}, fmtMXN(totalFactura))
        )
      )
    ),
    // Lista de cargas
    h("div", {style:C.card},
      h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:1.5,marginBottom:10}},
        "CARGAS PENDIENTES — Selecciona las que cubre esta factura"),
      cargas.length === 0 && h("div", {style:{color:"#7a9058",textAlign:"center",padding:14,fontStyle:"italic"}},
        "No hay cargas pendientes"),
      cargas.map((c,i) => h("div", {key:i,
        style:{padding:10,marginBottom:6,
               background:seleccionadas.has(c.id) ? "rgba(60,120,40,0.15)" : "rgba(255,255,255,0.02)",
               border: seleccionadas.has(c.id) ? "1px solid rgba(120,200,80,0.4)" : "1px solid rgba(255,255,255,0.05)",

          onClick: () => toggle(c.id)},
          h("input", {type:"checkbox",checked:seleccionadas.has(c.id),onChange:()=>{},
                     style:{width:18,height:18,cursor:"pointer"}}),
          h("div", {style:{flex:1,minWidth:0}},
            h("div", {style:{fontSize:11,color:"#7a9058"}}, fmtFecha(c.fecha) + " · " + c.id),
            h("div", {style:{fontSize:13,color:"#c8e898",fontWeight:600}}, c.tipo + " · " + (c.lugar || "—")),
            c.notas && h("div", {style:{fontSize:11,color:"#7a9058",fontStyle:"italic"}}, c.notas)
          ),
          h("div", {style:{textAlign:"right"}},
            h("div", {style:{fontSize:12,color:"#a0c870"}}, fmtNum(c.litros) + " L"),
            h("div", {style:{fontSize:14,fontWeight:700,color:"#e8a030"}}, fmtMXN(c.total))
          )
        ),
        seleccionadas.has(c.id) && h("div", {style:{display:"flex",alignItems:"center",gap:8,marginTop:8,paddingTop:8,borderTop:"1px solid rgba(255,255,255,0.06)"},

// ── Form: Contabilizar una carga ─────────────────────────────────────────────
function FormContabilizar({carga, onCancel, onSaved}) {
  const [form, setForm] = useState({
    proveedor: carga.proveedor || "",
    rfc_emisor: carga.rfc_emisor || "",
    folio_factura: carga.folio_factura || "",
    folio_fiscal: carga.folio_fiscal || "",
    fecha_factura: (carga.fecha_factura || carga.fecha || new Date().toISOString()).substring(0,10),
    subtotal: "",
    iva: "",
    ieps: "",
    total_factura: String(carga.total || ""),
    forma_pago: "03",     // 03 = transferencia
    metodo_pago: "PPD",
  });
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState("");
  const [procesandoFactura, setProcesandoFactura] = useState(false);

  // Procesar factura subida (XML o PDF) con Gemini/parser
  const procesarFactura = async (file) => {
    if (!file) return;
    setError(""); setProcesandoFactura(true);
    try {
      // Leer como base64
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const isXML = file.name.toLowerCase().endsWith(".xml");
      const accion = isXML ? "procesar_xml" : "procesar_pdf";
      const payload = isXML
        ? { accion: "procesar_xml", xml_base64: base64 }
        : { accion: "procesar_pdf", pdf_base64: base64 };

      const res = await fetch(SHEETS_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();

      if (!data.ok) {
        setError(data.error || "Error procesando factura");
        return;
      }
      const d = data.datos;
      // El backend ya calcula IEPS implícito si no viene desglosado.
      // d.subtotal y d.ieps ya están corregidos (base gravable real + IEPS calculado)
      setForm(f => ({
        ...f,
        proveedor: d.proveedor || f.proveedor,
        rfc_emisor: d.rfc_emisor || f.rfc_emisor,
        folio_factura: d.folio_factura || f.folio_factura,
        folio_fiscal: d.folio_fiscal || f.folio_fiscal,
        fecha_factura: d.fecha ? d.fecha.substring(0, 10) : f.fecha_factura,
        subtotal: d.subtotal > 0 ? Number(d.subtotal).toFixed(2) : f.subtotal,
        ieps: d.ieps > 0 ? Number(d.ieps).toFixed(2) : f.ieps,
        iva: d.iva > 0 ? Number(d.iva).toFixed(2) : f.iva,
        total_factura: d.total > 0 ? Number(d.total).toFixed(2) : f.total_factura,
      }));
      if (d.ieps_calculado_implicito) {
        // Mensaje informativo al usuario
        setTimeout(() => {
          alert("ℹ️ El XML no traía el IEPS desglosado. Se calculó automáticamente:\n\n" +
                "Subtotal XML original: $" + Number(d.subtotal_xml).toFixed(2) + "\n" +
                "Base gravable real (IVA÷0.16): $" + Number(d.subtotal).toFixed(2) + "\n" +
                "IEPS calculado: $" + Number(d.ieps).toFixed(2) + "\n\n" +
                "Verifica que todo cuadre antes de contabilizar.");
        }, 100);
      }
    } catch (e) {
      setError("Error al procesar: " + e.toString());
    } finally {
      setProcesandoFactura(false);
    }
  };

  // Auto-cálculo cuando el usuario solo captura subtotal + ieps
  const autoCalcular = () => {
    const sub = parseFloat(form.subtotal) || 0;
    const ie = parseFloat(form.ieps) || 0;
    const tot = parseFloat(form.total_factura) || 0;
    // Asume IVA 16% sobre subtotal gravable
    const iva = sub * 0.16;
    setForm(f => ({...f, iva: iva.toFixed(2)}));
  };

  // Calcular IEPS/IVA/Subtotal desde "IEPS por litro" del ticket
  // Fórmula: IEPS_total = litros × tasa_por_litro
  //          Resto = total_ticket - IEPS_total
  //          Subtotal = Resto / 1.16
  //          IVA = Resto - Subtotal
  const calcularDesdeLitros = () => {
    const tasaPorLitro = parseFloat(form.ieps_por_litro) || 0;
    const litros = parseFloat(carga.litros) || 0;
    const totalTicket = parseFloat(carga.total) || 0;
    if (tasaPorLitro <= 0 || litros <= 0 || totalTicket <= 0) {
      alert("Captura la tasa IEPS por litro primero");
      return;
    }
    const iepsTotal = litros * tasaPorLitro;
    const resto = totalTicket - iepsTotal;
    if (resto <= 0) {
      alert("La tasa IEPS es demasiado alta — el IEPS no puede ser mayor al total");
      return;
    }
    const subtotalCalc = resto / 1.16;
    const ivaCalc = resto - subtotalCalc;
    setForm(f => ({
      ...f,
      subtotal: subtotalCalc.toFixed(2),
      iva: ivaCalc.toFixed(2),
      ieps: iepsTotal.toFixed(2),
      total_factura: totalTicket.toFixed(2)
    }));
  };

  // Vista previa de la póliza
  const sub = parseFloat(form.subtotal) || 0;
  const iva = parseFloat(form.iva) || 0;
  const ieps = parseFloat(form.ieps) || 0;
  const tot = parseFloat(form.total_factura) || 0;
  const parteGravable = sub + iva;
  const parteExenta = ieps;
  const totalCalculado = parteGravable + parteExenta;
  const diferencia = Math.abs(totalCalculado - tot);
  const cuadra = tot > 0 && diferencia <= 0.05;
  const cuentaIva = form.metodo_pago === "PUE" ? "1191-001-0002" : "1196-001-0002";
  const nombreCuentaIva = form.metodo_pago === "PUE" ? "IVA acreditable PUE" : "IVA por acreditar PPD";

  const enviar = async () => {
    if (!cuadra) { setError("Total no cuadra. Subtotal + IEPS + IVA debe ser igual al total."); return; }
    if (!form.proveedor) { setError("Falta el proveedor"); return; }
    setError(""); setEnviando(true);
    try {
      const payload = {
        accion: "marcar_carga_contabilizada",
        id: carga.id,
        proveedor: form.proveedor,
        rfc_emisor: form.rfc_emisor,
        folio_factura: form.folio_factura,
        folio_fiscal: form.folio_fiscal,
        fecha_factura: form.fecha_factura,
        subtotal: form.subtotal,
        iva: form.iva,
        ieps: form.ieps,
        total_factura: form.total_factura,
        forma_pago: form.forma_pago,
        metodo_pago: form.metodo_pago,
        contabilizado_por: "Adry"
      };
      const res = await fetch(SHEETS_URL, {method:"POST", body: JSON.stringify(payload)});
      const data = await res.json();
      if (data.ok) {
        onSaved();
      } else {
        setError(data.error || "Error al contabilizar");
      }
    } catch(e) { setError(e.toString()); }
    finally { setEnviando(false); }
  };

  return h("div", null,
    h("div", {style:{marginBottom:14,display:"flex",alignItems:"center",gap:10}},
      h("button", {onClick:onCancel,style:{...C.ghost,padding:"8px 12px"}}, "← Volver"),
      h("div", {style:{fontSize:18,fontWeight:700,color:"#b8e870"}}, "Contabilizar carga")
    ),
    error && h("div", {style:{padding:12,background:"rgba(200,80,60,0.12)",border:"1px solid rgba(200,80,60,0.3)",borderRadius:10,color:"#e08060",marginBottom:14,fontSize:13}}, "⚠️ " + error),
    // Resumen de la carga
    h("div", {style:{...C.card,background:"rgba(80,160,30,0.06)",border:"1px solid rgba(120,200,80,0.18)"}},
      h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}},
        h("div", null,
          h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.2}}, "CARGA " + carga.id),
          h("div", {style:{fontSize:15,fontWeight:700,color:"#c8e898"}}, carga.tipo + " · " + carga.lugar),
          carga.notas && h("div", {style:{fontSize:11,color:"#7a9058",fontStyle:"italic",marginTop:2}}, carga.notas)
        ),
        h("div", {style:{textAlign:"right"}},
          h("div", {style:{fontSize:14,fontWeight:700,color:"#90c848"}}, fmtNum(carga.litros) + " L"),
          h("div", {style:{fontSize:14,color:"#e8a030"}}, fmtMXN(carga.total))
        )
      ),
      carga.link_foto_ticket && h("a", {href:carga.link_foto_ticket,target:"_blank",
        style:{color:"#8ab060",fontSize:12,textDecoration:"none",display:"inline-block",marginTop:8}},
        "📸 Ver foto del ticket")
    ),
    // Datos fiscales
    h("div", {style:C.card},
      h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:1.5,marginBottom:10}}, "DATOS DE LA FACTURA"),
      // Botón para subir factura XML o PDF y procesarla con Gemini
      h("div", {style:{padding:12,marginBottom:12,background:"rgba(80,120,200,0.06)",border:"1px dashed rgba(120,180,240,0.3)",borderRadius:10}},
        h("div", {style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
          h("div", {style:{fontSize:12,color:"#8ab0e0",flex:1,minWidth:180}},
            "📄 Sube la factura para auto-llenar los datos"),
          h("label", {style:{background:"linear-gradient(135deg,#3a5ea8,#2a4080)",border:"none",borderRadius:8,
                             color:"#d8e8ff",padding:"8px 14px",fontSize:12,fontWeight:700,
                             cursor:procesandoFactura?"not-allowed":"pointer",opacity:procesandoFactura?0.6:1}},
            procesandoFactura ? "⏳ Procesando..." : "Elegir archivo (XML o PDF)",
            h("input", {type:"file",accept:".xml,.pdf,application/xml,text/xml,application/pdf",
                       style:{display:"none"},disabled:procesandoFactura,
                       onChange:e => { if (e.target.files[0]) procesarFactura(e.target.files[0]); }})
          )
        ),
        h("div", {style:{fontSize:10,color:"#6a8ab0",marginTop:6,fontStyle:"italic"}},
          "XML → datos exactos del SAT · PDF → lectura automática con IA (revisa los datos)")
      ),
      h("div", {className:"grid2",style:{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10,marginBottom:10}},
        h("div", null,
          h("label", {style:lbl}, "Proveedor"),
          h("input", {value:form.proveedor,onChange:e=>setForm(f=>({...f,proveedor:e.target.value})),placeholder:"Pemex Estación XX",style:C.inp})
        ),
        h("div", null,
          h("label", {style:lbl}, "RFC emisor"),
          h("input", {value:form.rfc_emisor,onChange:e=>setForm(f=>({...f,rfc_emisor:e.target.value})),placeholder:"PEP970814I12",style:C.inp})
        )
      ),
      h("div", {className:"grid2",style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}},
        h("div", null,
          h("label", {style:lbl}, "Folio factura"),
          h("input", {value:form.folio_factura,onChange:e=>setForm(f=>({...f,folio_factura:e.target.value})),style:C.inp})
        ),
        h("div", null,
          h("label", {style:lbl}, "Fecha factura"),
          h("input", {type:"date",value:form.fecha_factura,onChange:e=>setForm(f=>({...f,fecha_factura:e.target.value})),style:C.inp})
        ),
        h("div", null,
          h("label", {style:lbl}, "Método de pago"),
          h("select", {value:form.metodo_pago,onChange:e=>setForm(f=>({...f,metodo_pago:e.target.value})),style:C.inp},
            h("option", {value:"PPD"}, "PPD (a crédito)"),
            h("option", {value:"PUE"}, "PUE (pago inmediato)")
          )
        )
      ),
      h("div", {style:{marginBottom:10}},
        h("label", {style:lbl}, "Folio fiscal (UUID) — opcional"),
        h("input", {value:form.folio_fiscal,onChange:e=>setForm(f=>({...f,folio_fiscal:e.target.value})),placeholder:"XXXX-XXXX-XXXX-XXXX",style:{...C.inp,fontFamily:"monospace",fontSize:12}})
      ),
      // Desglose monetario
      h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:1.5,marginTop:10,marginBottom:10,paddingTop:10,borderTop:"1px solid rgba(120,180,60,0.15)"}}, "DESGLOSE MONETARIO"),
      h("div", {className:"grid4",style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:8}},
        h("div", null,
          h("label", {style:lbl}, "Subtotal gravable"),
          h("input", {type:"number",step:"0.01",value:form.subtotal,onChange:e=>setForm(f=>({...f,subtotal:e.target.value})),placeholder:"0.00",style:C.inp})
        ),
        h("div", null,
          h("label", {style:lbl}, "IEPS"),
          h("input", {type:"number",step:"0.01",value:form.ieps,onChange:e=>setForm(f=>({...f,ieps:e.target.value})),placeholder:"0.00",style:C.inp})
        ),
        h("div", null,
          h("label", {style:lbl}, "IVA 16%"),
          h("input", {type:"number",step:"0.01",value:form.iva,onChange:e=>setForm(f=>({...f,iva:e.target.value})),placeholder:"0.00",style:C.inp})
        ),
        h("div", null,
          h("label", {style:lbl}, "Total factura"),
          h("input", {type:"number",step:"0.01",value:form.total_factura,onChange:e=>setForm(f=>({...f,total_factura:e.target.value})),placeholder:"0.00",style:{...C.inp,background:"rgba(200,160,60,0.1)",color:"#e8c870",fontWeight:700}})
        )
      ),
      h("button", {onClick:autoCalcular,style:{...C.ghost,fontSize:11,padding:"6px 10px",marginTop:5}},
        "🧮 Auto-calcular IVA (16% del subtotal)"),
      // Calculadora asistida: IEPS por litro × litros de la carga
      h("div", {style:{marginTop:10,padding:10,background:"rgba(80,140,200,0.06)",border:"1px dashed rgba(120,180,240,0.25)",borderRadius:9}},
        h("div", {style:{fontSize:11,color:"#8ab0e0",marginBottom:6}},
          "💡 Si tu ticket muestra el IEPS por litro (ej: $4.80/L), úsalo aquí:"),
        h("div", {style:{display:"flex",alignItems:"flex-end",gap:8,flexWrap:"wrap"}},
          h("div", {style:{flex:"0 0 140px"}},
            h("label", {style:lbl}, "IEPS por litro"),
            h("input", {type:"number",step:"0.0001",value:form.ieps_por_litro || "",
                       onChange:e=>setForm(f=>({...f,ieps_por_litro:e.target.value})),
                       placeholder:"4.8000",style:{...C.inp,fontSize:13}})
          ),
          h("div", {style:{flex:1,minWidth:100,fontSize:11,color:"#7a98c0"}},
            "× " + fmtNum(carga.litros) + " L × Total $" + fmtNum(carga.total) + " = autocalcula los 3 campos"),
          h("button", {onClick:calcularDesdeLitros,style:{...C.ghost,fontSize:11,padding:"7px 12px",background:"rgba(80,140,200,0.15)",color:"#a0c8f0"}},
            "📐 Calcular IEPS, IVA, Subtotal")
        )
      ),
      // Validación
      tot > 0 && h("div", {style:{padding:11,marginTop:14,
        background:cuadra?"rgba(80,160,30,0.1)":"rgba(200,80,60,0.1)",
        border:`1px solid ${cuadra?"rgba(120,200,80,0.3)":"rgba(200,80,60,0.3)"}`,
        borderRadius:10,fontSize:13,
        color:cuadra?"#90c848":"#e08060"}},
        cuadra
          ? "✅ Cuadra: " + fmtMXN(sub) + " + " + fmtMXN(ieps) + " + " + fmtMXN(iva) + " = " + fmtMXN(totalCalculado)
          : "⚠️ No cuadra. Suma: " + fmtMXN(totalCalculado) + " · Total capturado: " + fmtMXN(tot) + " · Diferencia: " + fmtMXN(diferencia)
      )
    ),
    // Vista previa de póliza
    cuadra && h("div", {style:C.card},
      h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:1.5,marginBottom:10}}, "VISTA PREVIA DE PÓLIZA Dr (Diario)"),
      h("table", {style:{fontFamily:"monospace",fontSize:12,width:"100%"}},
        h("thead", null,
          h("tr", null,
            h("th", {style:{textAlign:"left",color:"#6a9050",fontSize:10,padding:"6px 4px"}}, "CUENTA"),
            h("th", {style:{textAlign:"left",color:"#6a9050",fontSize:10,padding:"6px 4px"}}, "NOMBRE"),
            h("th", {style:{textAlign:"right",color:"#6a9050",fontSize:10,padding:"6px 4px"}}, "CARGO"),
            h("th", {style:{textAlign:"right",color:"#6a9050",fontSize:10,padding:"6px 4px"}}, "ABONO")
          )
        ),
        h("tbody", null,
          h("tr", null,
            h("td", {style:{padding:"5px 4px",color:"#b8e870"}}, "6000-021-0001"),
            h("td", {style:{padding:"5px 4px",color:"#a0c870"}}, "Combustibles"),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#90c848"}}, fmtMXN(sub)),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#5a7a40"}}, "—")
          ),
          ieps > 0 && h("tr", null,
            h("td", {style:{padding:"5px 4px",color:"#b8e870"}}, "6000-023-0009"),
            h("td", {style:{padding:"5px 4px",color:"#a0c870"}}, "IEPS gastos"),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#90c848"}}, fmtMXN(ieps)),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#5a7a40"}}, "—")
          ),
          iva > 0 && h("tr", null,
            h("td", {style:{padding:"5px 4px",color:"#b8e870"}}, cuentaIva),
            h("td", {style:{padding:"5px 4px",color:"#a0c870"}}, nombreCuentaIva),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#90c848"}}, fmtMXN(iva)),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#5a7a40"}}, "—")
          ),
          parteGravable > 0 && h("tr", null,
            h("td", {style:{padding:"5px 4px",color:"#b8e870"}}, "2110-002"),
            h("td", {style:{padding:"5px 4px",color:"#a0c870"}}, "Proveedor 16%"),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#5a7a40"}}, "—"),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#c8a030"}}, fmtMXN(parteGravable))
          ),
          parteExenta > 0 && h("tr", null,
            h("td", {style:{padding:"5px 4px",color:"#b8e870"}}, "2110-003"),
            h("td", {style:{padding:"5px 4px",color:"#a0c870"}}, "Proveedor 0% exento"),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#5a7a40"}}, "—"),
            h("td", {style:{padding:"5px 4px",textAlign:"right",color:"#c8a030"}}, fmtMXN(parteExenta))
          )
        )
      )
    ),
    h("div", {style:{display:"flex",gap:10,marginTop:14}},
      h("button", {onClick:onCancel,style:{...C.ghost,flex:1,padding:"12px"}}, "Cancelar"),
      h("button", {onClick:enviar,disabled:enviando||!cuadra,
        style:{...C.bigBtn,flex:2,opacity:(enviando||!cuadra)?0.5:1,cursor:(enviando||!cuadra)?"not-allowed":"pointer"}},
        enviando ? "⏳ Contabilizando..." : "💼 Marcar como contabilizado")
    )
  );
}

// ── Sub: Contabilizadas (con botón para registrar pago) ──────────────────────
function SubCombustibleContabilizadas() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [pagando, setPagando] = useState(null);  // id de la carga que se está pagando
  const [refresh, setRefresh] = useState(0);

  useEffect(() => {
    setLoading(true); setError("");
    fetch(SHEETS_URL + "?accion=obtener_cargas_contabilizadas")
      .then(r => r.json())
      .then(d => { setData(d); setLoading(false); })
      .catch(e => { setError(e.toString()); setLoading(false); });
  }, [refresh]);

  const registrarPago = async (carga) => {
    if (!confirm("¿Confirmar pago de " + fmtMXN(carga.total_factura) + " desde BBVA?")) return;
    setPagando(carga.id);
    try {
      const res = await fetch(SHEETS_URL, {method:"POST", body: JSON.stringify({
        accion: "marcar_carga_pagada",
        id: carga.id,
        fecha_pago: new Date().toISOString(),
        cuenta_banco: "1120-001-0001",
        pagado_por: "Adry"
      })});
      const data = await res.json();
      if (data.ok) {
        setRefresh(r => r+1);
      } else {
        alert("Error: " + (data.error || "desconocido"));
      }
    } catch(e) { alert("Error: " + e.toString()); }
    finally { setPagando(null); }
  };

  const cargas = (data && data.cargas) || [];
  return h("div", null,
    loading && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30}}, "Cargando..."),
    error && h("div", {style:{color:"#e08060",padding:14,background:"rgba(200,80,60,0.1)",borderRadius:10}}, "Error: " + error),
    !loading && cargas.length === 0 && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30,fontStyle:"italic"}},
      "Aún no hay cargas contabilizadas"),
    !loading && cargas.length > 0 && h("div", {style:{fontSize:11,color:"#5a7a40",letterSpacing:1.5,marginBottom:10}},
      cargas.length + " CARGA" + (cargas.length>1?"S":"") + " CONTABILIZADA" + (cargas.length>1?"S":"") + " PENDIENTE" + (cargas.length>1?"S":"") + " DE PAGO"),
    !loading && cargas.map((c,i) => h("div", {key:i,style:C.card},
      h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8,flexWrap:"wrap",gap:8}},
        h("div", {style:{flex:1,minWidth:200}},
          h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.2,marginBottom:2}},
            fmtFecha(c.fecha_factura || c.fecha) + " · " + (c.folio_factura || c.id)),
          h("div", {style:{fontSize:15,fontWeight:700,color:"#c8e898"}}, c.proveedor || "—"),
          h("div", {style:{fontSize:12,color:"#a0c870"}}, c.tipo + " · " + (c.lugar || "")),
          h("div", {style:{fontSize:11,color:"#7a9058",marginTop:2}},
            "RFC: " + (c.rfc_emisor || "—") + " · " + c.metodo_pago)
        ),
        h("div", {style:{textAlign:"right"}},
          h("div", {style:{fontSize:11,color:"#7a9058"}}, "Subtotal " + fmtMXN(c.subtotal)),
          c.iva > 0 && h("div", {style:{fontSize:11,color:"#7a9058"}}, "IVA " + fmtMXN(c.iva)),
          c.ieps > 0 && h("div", {style:{fontSize:11,color:"#7a9058"}}, "IEPS " + fmtMXN(c.ieps)),
          h("div", {style:{fontSize:15,fontWeight:700,color:"#e8a030",marginTop:3}}, fmtMXN(c.total_factura))
        )
      ),
      h("div", {style:{display:"flex",gap:8,marginTop:10,paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.05)",flexWrap:"wrap",alignItems:"center"}},

function SubCombustibleStock() {
  const stockData = useFetch(SHEETS_URL + "?accion=obtener_stock_combustible");

  const stock = (stockData.data && stockData.data.stock) || [];
  const consumos = (consumosData.data && consumosData.data.consumos) || [];

  // Agrupar consumos por equipo
  const porEquipo = {};
  consumos.forEach(k => {
    const eq = k.equipo || "Sin asignar";
    if (!porEquipo[eq]) porEquipo[eq] = { litros: 0, count: 0 };
    porEquipo[eq].litros += Number(k.litros) || 0;
    porEquipo[eq].count += 1;
  });

  return h("div", null,
    h("div", {className:"grid2",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}},
      stock.map((s,i) => h("div", {key:i,style:C.card},

        h("div", {style:{fontSize:32,fontWeight:800,color:Number(s.stock_actual)<30?"#e8c060":"#90c848"}},
          fmtNum(s.stock_actual) + " L"),
        h("div", {style:{fontSize:12,color:"#7a9058",marginTop:6}},
          "Cargado: " + fmtNum(s.litros_cargados) + " L · Consumido: " + fmtNum(s.litros_consumidos) + " L"),
        h("div", {style:{fontSize:12,color:"#e8a030",marginTop:2}},
          "Gasto: " + fmtMXN(s.gasto_total) + " (" + fmtMXN(s.precio_promedio_L) + "/L)")
      ))
    ),
    Object.keys(porEquipo).length > 0 && h("div", null,
      h("div", {style:{fontSize:11,color:"#5a7a40",letterSpacing:2,marginBottom:8}}, "CONSUMO POR EQUIPO"),
      Object.entries(porEquipo).sort((a,b)=>b[1].litros-a[1].litros).map(([eq, info]) =>
        h("div", {key:eq,style:{...C.card,padding:"10px 14px"}},
          h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h("div", {style:{fontSize:14,color:"#c8e898"}}, eq),
            h("div", {style:{textAlign:"right"}},
              h("div", {style:{fontSize:14,fontWeight:700,color:"#90c848"}}, fmtNum(info.litros) + " L"),
              h("div", {style:{fontSize:11,color:"#7a9058"}}, info.count + " consumo" + (info.count>1?"s":""))
            )
          )
        )
      )
    ),
    consumos.length > 0 && h("div", {style:{marginTop:18}},
      h("div", {style:{fontSize:11,color:"#5a7a40",letterSpacing:2,marginBottom:8}}, "ÚLTIMOS CONSUMOS"),
      consumos.slice(0, 15).map((k,i) => h("div", {key:i,style:{...C.card,padding:"10px 14px"}},
        h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("div", null,
            h("div", {style:{fontSize:11,color:"#6a9050"}}, fmtFecha(k.fecha) + " · " + k.tipo),
            h("div", {style:{fontSize:13,color:"#c8e898"}}, k.equipo),
            k.actividad && h("div", {style:{fontSize:11,color:"#8aa870",fontStyle:"italic"}}, k.actividad)
          ),
          h("div", {style:{textAlign:"right"}},
            h("div", {style:{fontSize:13,fontWeight:700,color:"#c8a030"}}, fmtNum(k.litros) + " L"),
            k.operador && h("div", {style:{fontSize:11,color:"#8aa870"}}, k.operador)
          )
        )
      ))
    )
  );
}

// ── Sub: Pólizas para COI ────────────────────────────────────────────────────
function SubCombustiblePolizas() {
  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const ahora = new Date();
  const [mes, setMes] = useState(MESES[ahora.getMonth()] + ahora.getFullYear());

  const {data, loading, error} = useFetch(SHEETS_URL + "?accion=obtener_polizas_mes&mes=" + encodeURIComponent(mes), [mes]);
  const polizas = (data && data.polizas) || [];

  const mesesOpciones = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(ahora.getFullYear(), ahora.getMonth() - i, 1);
    mesesOpciones.push(MESES[d.getMonth()] + d.getFullYear());
  }

  const exportarCSV = () => {
    if (polizas.length === 0) return;
    const lineas = ["tipo,numero_poliza,fecha,concepto,cuenta,nombre_cuenta,cargo,abono,centro_costos,referencia,uuid,rfc,proveedor,folio"];
    polizas.forEach(p => {
      p.movimientos.forEach(m => {
        const fila = [
          p.tipo_poliza,
          p.numero_poliza,
          fmtFecha(p.fecha),
          '"' + (p.concepto || "").replace(/"/g, '""') + '"',
          m.cuenta,
          '"' + (m.nombre_cuenta || "").replace(/"/g, '""') + '"',
          m.cargo || "",
          m.abono || "",
          m.centro_costos || "",
          p.referencia || "",
          p.uuid || "",
          p.rfc || "",
          '"' + (p.proveedor || "").replace(/"/g, '""') + '"',
          p.folio || ""
        ].join(",");
        lineas.push(fila);
      });
    });
    const csv = "\uFEFF" + lineas.join("\n");  // BOM para Excel
    const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Polizas_" + mes + ".csv";
    a.click();
    URL.revokeObjectURL(url);
  };

  const totalCargo = polizas.reduce((s,p) => s + (p.total_cargo || 0), 0);
  const totalAbono = polizas.reduce((s,p) => s + (p.total_abono || 0), 0);

  return h("div", null,
    h("div", {style:{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"end"}},
      h("div", {style:{flex:1,minWidth:200}},
        h("label", {style:lbl}, "Mes"),
        h("select", {value:mes,onChange:e=>setMes(e.target.value),style:{...C.inp,maxWidth:280}},
          mesesOpciones.map(m => h("option", {key:m,value:m}, m))
        )
      ),
      h("button", {onClick:exportarCSV,disabled:polizas.length===0,
        style:{background:"linear-gradient(135deg,#2a6a14,#1e5010)",border:"none",borderRadius:10,
               color:"#c8f090",padding:"12px 18px",fontSize:14,fontWeight:700,cursor:polizas.length===0?"not-allowed":"pointer",
               opacity:polizas.length===0?0.5:1}},
        "📥 Exportar CSV para COI")
    ),
    polizas.length > 0 && h("div", {className:"grid3",style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:14}},
      h("div", {style:C.stat},
        h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "PÓLIZAS"),
        h("div", {style:{fontSize:28,fontWeight:800,color:"#b8e870"}}, polizas.length)
      ),
      h("div", {style:C.stat},
        h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "TOTAL CARGO"),
        h("div", {style:{fontSize:18,fontWeight:800,color:"#90c848"}}, fmtMXN(totalCargo))
      ),
      h("div", {style:C.stat},
        h("div", {style:{fontSize:11,color:"#6a9050",letterSpacing:1.5,marginBottom:6}}, "TOTAL ABONO"),
        h("div", {style:{fontSize:18,fontWeight:800,color:"#c8a030"}}, fmtMXN(totalAbono))
      )
    ),
    loading && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30}}, "Cargando..."),
    error && h("div", {style:{color:"#e08060",padding:14}}, "Error: " + error),
    !loading && polizas.length === 0 && h("div", {style:{color:"#6a8a50",textAlign:"center",padding:30,fontStyle:"italic"}},
      "Sin pólizas en " + mes),
    !loading && polizas.map((p,i) => h("div", {key:i,style:C.card},
      h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:8}},
        h("div", null,
          h("div", {style:{fontSize:13,fontWeight:700,color:p.tipo_poliza==="Dr"?"#b8e870":"#c8a8e8"}},
            p.tipo_poliza + " · " + p.numero_poliza),
          h("div", {style:{fontSize:12,color:"#a0c870"}}, p.concepto)
        ),
        h("div", {style:{fontSize:11,color:"#7a9058",textAlign:"right"}},
          fmtFecha(p.fecha)
        )
      ),
      h("table", {style:{fontFamily:"monospace",fontSize:11,width:"100%",marginTop:6}},
        h("tbody", null,
          p.movimientos.map((m,j) => h("tr", {key:j},
            h("td", {style:{padding:"3px 4px",color:"#b8e870",width:120}}, m.cuenta),
            h("td", {style:{padding:"3px 4px",color:"#a0c870"}}, m.nombre_cuenta),
            h("td", {style:{padding:"3px 4px",textAlign:"right",color:"#90c848",width:90}},
              m.cargo > 0 ? fmtMXN(m.cargo) : "—"),
            h("td", {style:{padding:"3px 4px",textAlign:"right",color:"#c8a030",width:90}},
              m.abono > 0 ? fmtMXN(m.abono) : "—")
          ))
        )
      )
    ))
  );
}

function TabPolizasAgro() {
  const [reload, setReload] = useState(0);
  const [busy, setBusy] = useState("");
  const [estado, setEstado] = useState({});
  const [vista, setVista] = useState("contabilizar");
  const [reloadP, setReloadP] = useState(0);
  const {data, loading, error} = useFetch(SHEETS_URL + "?accion=facturas_agro_pendientes", [reload]);
  const facturas = (data && data.facturas) || [];
  const porPagar = useFetch(SHEETS_URL + "?accion=facturas_agro_por_pagar", [reloadP]);
  const facturasPagar = (porPagar.data && porPagar.data.facturas) || [];
  const [reloadAp, setReloadAp] = useState(0);
  const pasesAp = useFetch(SHEETS_URL + "?accion=pases_aplicacion_pendientes", [reloadAp]);
  const pases = (pasesAp.data && pasesAp.data.pases) || [];
  useEffect(() => {
    if (!facturas.length) return;
    setEstado(prev => {
      const next = {...prev};
      facturas.forEach(f => {
        if (!next[f.uuid]) {
          const clasif = {};
          f.lineas.forEach(l => { clasif[l.id_producto] = l.sugerido || "agroquimico"; });
          next[f.uuid] = { metodo:"PPD", clasif };
        }
      });
      return next;
    });
  }, [data]);
  function setMetodo(uuid, metodo){ setEstado(prev => ({...prev, [uuid]:{...(prev[uuid]||{clasif:{}}), metodo}})); }
  function setTipo(uuid, idp, tipo){ setEstado(prev => { const e = prev[uuid]||{metodo:"PPD",clasif:{}}; return {...prev,[uuid]:{...e,clasif:{...e.clasif,[idp]:tipo}}}; }); }
  async function generar(f){
    if (busy) return;
    const e = estado[f.uuid] || {};
    let clasif = (e.clasif && Object.keys(e.clasif).length) ? e.clasif : {};
    if (!Object.keys(clasif).length) { f.lineas.forEach(l => { clasif[l.id_producto] = l.sugerido||"agroquimico"; }); }
    const metodo = e.metodo || "PPD";
    setBusy(f.uuid);
    try {
      const url = SHEETS_URL + "?accion=contabilizar_factura_agro&uuid=" + encodeURIComponent(f.uuid) + "&metodo=" + metodo + "&clasificacion=" + encodeURIComponent(JSON.stringify(clasif));
      const d = await (await fetch(url)).json();
      if (d.ok){ alert("✅ Póliza generada: " + d.numero_poliza); setReload(x=>x+1); }
      else alert("No se pudo: " + (d.error||"error"));
    } catch(err){ alert("Error: " + err); }
    setBusy("");
  }
  async function abrirXmlMes(){
    try {
      const d = await (await fetch(SHEETS_URL + "?accion=carpeta_xml_mes")).json();
      if (d.ok && d.url) window.open(d.url, "_blank");
      else alert("No se pudo abrir la carpeta: " + (d.error || "sin carpeta configurada"));
    } catch(e){ alert("Error: " + e); }
  }
  async function pagar(f){
    if (busy) return;
    if (!confirm("¿Registrar el pago de la factura " + (f.folio||"") + " por " + fmtMXN(f.total) + "? Genera la póliza de Egresos (pago a banco)" + (f.metodo==="PPD"?" y reclasifica el IVA":"") + ".")) return;
    setBusy(f.uuid);
    try {
      const d = await (await fetch(SHEETS_URL + "?accion=pagar_factura_agro&uuid=" + encodeURIComponent(f.uuid))).json();
      if (d.ok){ alert("✅ Pago registrado: " + d.numero_poliza + (d.iva_reclasificado>0?" · IVA reclasificado " + fmtMXN(d.iva_reclasificado):"")); setReloadP(x=>x+1); }
      else alert("No se pudo: " + (d.error||"error"));
    } catch(err){ alert("Error: " + err); }
    setBusy("");
  }
  async function contabilizarPase(p){
    if (busy) return;
    if (!p.cc){ alert("⚠️ Este pase no tiene centro de costos mapeado para el rancho:\n" + (p.rancho||"") + "\nNo se puede generar la póliza hasta resolver el mapeo."); return; }
    if (!confirm("¿Generar póliza de aplicación?\n\nRancho: " + (p.rancho||"") + "\nCentro de costo: " + p.cc + "\nProductos: " + p.lineas.length + "\nTotal: " + fmtMXN(p.total) + "\n\nDr Gasto (con CC) / Cr Almacén")) return;

      if (d.ok){ alert("✅ Póliza de aplicación: " + d.numero_poliza + " · centro de costo " + d.centro_costos); setReloadAp(x=>x+1); }
      else alert("No se pudo: " + (d.error||"error"));
    } catch(err){ alert("Error: " + err); }
    setBusy("");
  }
  const tipoBtn = (activo) => ({padding:"4px 10px",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer",border:"1px solid " + (activo?"rgba(120,180,60,0.6)":"rgba(255,255,255,0.12)"),background:activo?"rgba(120,180,60,0.22)":"transparent",color:activo?"#c8f090":"#7a9058"});
  return h("div", null,
    h("div", {style:{marginBottom:14}},
      h("div", {style:{fontSize:11,color:"#5a8040",letterSpacing:2,marginBottom:4}}, "CONTABILIDAD"),
